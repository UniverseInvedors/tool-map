<script>
// ---------------------------------------------
// MAP INIT
// ---------------------------------------------
const map = L.map('map', { zoomControl: true }).setView([20, 0], 3);

const TILES = {
  osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'� OpenStreetMap', maxZoom:19 }),
  dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution:'� CartoDB', maxZoom:19 }),
  light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution:'� CartoDB', maxZoom:19 }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution:'� Esri', maxZoom:19 }),
  topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution:'� OpenTopoMap', maxZoom:17 }),
  watercolor: L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg', { attribution:'� Stadia Maps', maxZoom:16 })
};
TILES.dark.addTo(map);
let currentTile = TILES.dark;

// Cluster group
let markerCluster = L.markerClusterGroup();
let clusterEnabled = false;
map.addLayer(markerCluster);

// Feature collections
const features = [];
let featureCount = 0;
let geojsonLayer = null;
let heatLayer = null;

// Drawing state
let activeTool = 'select';
let drawPoints = [];
let drawMode = null; // active L.polyline/polygon being drawn
let tempLayer = null;

// Measure state
let measureActive = false;
let measurePoints = [];
let measureLayer = null;

// Route state
const waypoints = [];
let routeLayer = null;

// ---------------------------------------------
// MODE SWITCH
// ---------------------------------------------
function switchMode(mode, btn) {
  document.querySelectorAll('.et').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.spanel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + mode).classList.add('active');
  // Stop measure if switching away
  if(mode !== 'measure' && measureActive) toggleMeasure();
  if(mode === 'route') {
    map.off('click', onMapClick);
    map.on('click', onRouteClick);
  } else {
    map.off('click', onRouteClick);
    map.on('click', onMapClick);
  }
  currentMode = mode;
}
let currentMode = 'builder';
map.on('click', onMapClick);

// ---------------------------------------------
// TILE LAYERS
// ---------------------------------------------
function setTile(name, btn) {
  map.removeLayer(currentTile);
  currentTile = TILES[name];
  currentTile.addTo(map);
  currentTile.bringToBack();
  document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ---------------------------------------------
// DRAWING TOOLS
// ---------------------------------------------
function setTool(tool, btn) {
  activeTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if(drawMode) { map.removeLayer(drawMode); drawMode = null; drawPoints = []; }
  document.getElementById('sb-tool-active').textContent = 'Tool: ' + tool.charAt(0).toUpperCase() + tool.slice(1);
  map.getContainer().style.cursor = tool === 'select' ? '' : 'crosshair';
}

function onMapClick(e) {
  if(measureActive) { addMeasurePoint(e.latlng); return; }
  const latlng = e.latlng;
  const color = document.getElementById('marker-color').value;
  switch(activeTool) {
    case 'marker': addMarker(latlng, color); break;
    case 'polyline': addPolylinePoint(latlng); break;
    case 'polygon': addPolygonPoint(latlng); break;
    case 'circle': addCircle(latlng); break;
    case 'rectangle': addRectangle(latlng); break;
  }
}

function addMarker(latlng, color='#5ee6a8') {
  const icon = L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,.8);box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`,
    iconSize: [14,14], iconAnchor:[7,7]
  });
  const marker = L.marker(latlng, { icon });
  const name = 'Marker ' + (++featureCount);
  marker.bindPopup(`<b>${name}</b><br>${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)}`);
  if(clusterEnabled) markerCluster.addLayer(marker);
  else marker.addTo(map);
  addFeature(marker, 'marker', name);
}

let polylinePoints = [];
function addPolylinePoint(latlng) {
  polylinePoints.push(latlng);
  if(drawMode) map.removeLayer(drawMode);
  if(polylinePoints.length > 1) {
    drawMode = L.polyline(polylinePoints, { color: document.getElementById('marker-color').value, weight:3 }).addTo(map);
    if(polylinePoints.length >= 2) {
      drawMode.bindPopup('Line � double-click to finish');
    }
  }
}

map.on('dblclick', e => {
  if(activeTool === 'polyline' && polylinePoints.length >= 2) {
    const line = L.polyline(polylinePoints, { color: document.getElementById('marker-color').value, weight:3 }).addTo(map);
    if(drawMode) map.removeLayer(drawMode);
    drawMode = null; polylinePoints = [];
    addFeature(line, 'polyline', 'Line ' + (++featureCount));
    map.getContainer().style.cursor = 'crosshair';
  }
  if(activeTool === 'polygon' && polygonPoints.length >= 3) {
    const poly = L.polygon(polygonPoints, { color: document.getElementById('marker-color').value, fillOpacity:0.2 }).addTo(map);
    if(drawMode) map.removeLayer(drawMode);
    drawMode = null; polygonPoints = [];
    addFeature(poly, 'polygon', 'Polygon ' + (++featureCount));
  }
});

let polygonPoints = [];
function addPolygonPoint(latlng) {
  polygonPoints.push(latlng);
  if(drawMode) map.removeLayer(drawMode);
  if(polygonPoints.length >= 3) {
    drawMode = L.polygon(polygonPoints, { color: document.getElementById('marker-color').value, fillOpacity:0.15 }).addTo(map);
  }
}

function addCircle(latlng) {
  const circle = L.circle(latlng, { radius: 500, color: document.getElementById('marker-color').value, fillOpacity:0.2 }).addTo(map);
  addFeature(circle, 'circle', 'Circle ' + (++featureCount));
}

let rectStart = null;
function addRectangle(latlng) {
  if(!rectStart) { rectStart = latlng; toast('Click second corner to finish rectangle','info'); return; }
  const rect = L.rectangle([rectStart, latlng], { color: document.getElementById('marker-color').value, fillOpacity:0.2 }).addTo(map);
  addFeature(rect, 'rectangle', 'Rect ' + (++featureCount));
  rectStart = null;
}

function addFeature(layer, type, name) {
  features.push({ layer, type, name, visible: true });
  renderLayerList();
}

function renderLayerList() {
  const list = document.getElementById('layer-list');
  list.innerHTML = '';
  features.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'layer-item';
    item.innerHTML = `<input type="checkbox" ${f.visible?'checked':''} onchange="toggleLayer(${i},this.checked)"/>
      <span style="flex:1">${getTypeIcon(f.type)} ${f.name}</span>
      <span class="del" onclick="removeFeature(${i})">?</span>`;
    list.appendChild(item);
  });
  document.getElementById('layer-count').textContent = features.length;
  document.getElementById('sb-objects').textContent = features.length + ' features';
}

function getTypeIcon(t) {
  return {marker:'??',polyline:'?',polygon:'?',circle:'?',rectangle:'?',geojson:'{}'}[t]||'??';
}

function toggleLayer(i, vis) {
  features[i].visible = vis;
  if(vis) features[i].layer.addTo(map);
  else map.removeLayer(features[i].layer);
}

function removeFeature(i) {
  map.removeLayer(features[i].layer);
  features.splice(i, 1);
  renderLayerList();
}

function toggleClustering(enabled) {
  clusterEnabled = enabled;
  // Rebuild markers
  features.filter(f => f.type === 'marker').forEach(f => {
    map.removeLayer(f.layer);
    markerCluster.removeLayer(f.layer);
    if(enabled) markerCluster.addLayer(f.layer);
    else f.layer.addTo(map);
  });
  toast(enabled ? 'Clustering enabled' : 'Clustering disabled','info');
}

// ---------------------------------------------
// SEARCH
// ---------------------------------------------
async function searchPlace() {
  const q = document.getElementById('search-input').value.trim();
  if(!q) return;
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`, { headers:{'Accept-Language':'en'} });
    const data = await res.json();
    if(!data.length) { toast('Place not found','err'); return; }
    const {lat,lon,display_name} = data[0];
    map.setView([parseFloat(lat), parseFloat(lon)], 13);
    L.popup().setLatLng([parseFloat(lat), parseFloat(lon)]).setContent(display_name).openOn(map);
    toast(display_name.substring(0,50)+'�','ok');
  } catch(e) { toast('Search failed: ' + e.message,'err'); }
}

// ---------------------------------------------
// ROUTE PLANNER
// ---------------------------------------------
function onRouteClick(e) {
  const latlng = e.latlng;
  waypoints.push({ latlng, name: `WP ${waypoints.length+1}` });
  renderWaypointList();
  toast('Waypoint added','ok');
}

function addWaypointBySearch() {
  const q = document.getElementById('wp-input').value.trim();
  if(!q) return;
  fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`, { headers:{'Accept-Language':'en'} })
    .then(r=>r.json()).then(data => {
      if(!data.length) { toast('Place not found','err'); return; }
      const latlng = L.latLng(parseFloat(data[0].lat), parseFloat(data[0].lon));
      waypoints.push({ latlng, name: data[0].display_name.split(',')[0] });
      renderWaypointList();
      map.panTo(latlng);
      document.getElementById('wp-input').value = '';
    }).catch(e => toast('Search failed','err'));
}

function renderWaypointList() {
  const list = document.getElementById('waypoint-list');
  list.innerHTML = '';
  waypoints.forEach((wp, i) => {
    const item = document.createElement('div');
    item.className = 'wp-item';
    item.innerHTML = `<span class="wp-num">${i+1}</span><span style="flex:1;font-size:.7rem">${wp.name}</span><span class="del" onclick="removeWaypoint(${i})" style="cursor:pointer;color:var(--t4)">?</span>`;
    list.appendChild(item);
  });
}

function removeWaypoint(i) { waypoints.splice(i,1); renderWaypointList(); }

async function calculateRoute() {
  if(waypoints.length < 2) { toast('Add at least 2 waypoints','err'); return; }
  // Straight-line distance
  let totalDist = 0;
  for(let i=0;i<waypoints.length-1;i++) totalDist += waypoints[i].latlng.distanceTo(waypoints[i+1].latlng);
  // Try OSRM for actual routing
  try {
    const coords = waypoints.map(w => `${w.latlng.lng},${w.latlng.lat}`).join(';');
    const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.code === 'Ok' && data.routes.length) {
      const route = data.routes[0];
      const km = (route.distance/1000).toFixed(1);
      const mins = Math.round(route.duration/60);
      if(routeLayer) map.removeLayer(routeLayer);
      routeLayer = L.geoJSON(route.geometry, { style:{ color:'#5ee6a8', weight:4, opacity:0.8 } }).addTo(map);
      document.getElementById('route-result').style.display='block';
      document.getElementById('route-distance').textContent = `?? ${km} km`;
      document.getElementById('route-duration').textContent = `?? ~${mins} min driving � ?? ~${Math.round(mins*3.5)} min walking`;
      map.fitBounds(routeLayer.getBounds(), { padding:[20,20] });
    } else {
      throw new Error('No route found');
    }
  } catch(e) {
    // Fallback to straight line
    if(routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.polyline(waypoints.map(w=>w.latlng), { color:'#5ee6a8', weight:3, dashArray:'8,6' }).addTo(map);
    const km = (totalDist/1000).toFixed(1);
    document.getElementById('route-result').style.display='block';
    document.getElementById('route-distance').textContent = `?? ${km} km (straight line)`;
    document.getElementById('route-duration').textContent = `?? Routing API unavailable. Showing straight-line.`;
    map.fitBounds(routeLayer.getBounds(), { padding:[20,20] });
  }
}

function clearRoute() {
  waypoints.length = 0;
  renderWaypointList();
  if(routeLayer) { map.removeLayer(routeLayer); routeLayer=null; }
  document.getElementById('route-result').style.display='none';
}

// ---------------------------------------------
// HEATMAP
// ---------------------------------------------
let heatData = [];

function importCSVHeatmap(file) {
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').filter(l=>l.trim());
    heatData = [];
    lines.forEach(line => {
      const parts = line.split(',');
      if(parts.length >= 2) {
        const lat = parseFloat(parts[0]), lng = parseFloat(parts[1]);
        const intensity = parts[2] ? parseFloat(parts[2]) : 1;
        if(!isNaN(lat) && !isNaN(lng)) heatData.push([lat, lng, intensity]);
      }
    });
    updateHeatmap();
    if(heatData.length) map.fitBounds(L.latLngBounds(heatData.map(p=>[p[0],p[1]])));
    document.getElementById('heatmap-status').textContent = heatData.length + ' data points loaded';
    toast(heatData.length + ' points loaded','ok');
  };
  reader.readAsText(file);
}

function loadSampleHeatmap() {
  // Generate random sample data around major cities
  const centers = [[51.5,-0.1],[40.7,-74],[35.6,139.7],[-33.9,151.2],[48.8,2.3]];
  heatData = [];
  centers.forEach(([lat,lng]) => {
    for(let i=0;i<100;i++) {
      heatData.push([lat+(Math.random()-0.5)*2, lng+(Math.random()-0.5)*2, Math.random()]);
    }
  });
  updateHeatmap();
  document.getElementById('heatmap-status').textContent = heatData.length + ' sample points';
  toast('Sample heatmap loaded','ok');
}

function updateHeatmap() {
  if(!heatData.length) return;
  if(heatLayer) map.removeLayer(heatLayer);
  const radius = parseInt(document.getElementById('heat-radius').value);
  const blur = parseInt(document.getElementById('heat-blur').value);
  const max = parseFloat(document.getElementById('heat-max').value);
  heatLayer = L.heatLayer(heatData, { radius, blur, max, gradient:{0.4:'blue',0.65:'lime',1:'red'} }).addTo(map);
}

// ---------------------------------------------
// GEOJSON EDITOR
// ---------------------------------------------
function previewGeoJSON() {
  // Live preview as user types with debounce
  clearTimeout(previewGeoJSON._t);
  previewGeoJSON._t = setTimeout(() => { try { renderGeoJSON(); } catch(e) {} }, 800);
}

function validateGeoJSON() {
  const txt = document.getElementById('geojson-editor').value.trim();
  const status = document.getElementById('geojson-status');
  try {
    const parsed = JSON.parse(txt);
    if(!parsed.type) throw new Error('Missing "type" property');
    status.textContent = '? Valid GeoJSON (' + (parsed.features?.length||1) + ' features)';
    status.style.color = 'var(--green)';
  } catch(e) {
    status.textContent = '? Invalid: ' + e.message;
    status.style.color = '#f87171';
  }
}

function prettyPrintGeoJSON() {
  const txt = document.getElementById('geojson-editor').value.trim();
  try {
    const parsed = JSON.parse(txt);
    document.getElementById('geojson-editor').value = JSON.stringify(parsed, null, 2);
    document.getElementById('geojson-status').textContent = 'Prettified';
  } catch(e) {
    toast('Invalid JSON','err');
  }
}

function renderGeoJSON() {
  const txt = document.getElementById('geojson-editor').value.trim();
  if(!txt) return;
  try {
    const parsed = JSON.parse(txt);
    if(geojsonLayer) map.removeLayer(geojsonLayer);
    geojsonLayer = L.geoJSON(parsed, {
      style: { color:'#5ee6a8', weight:2, fillOpacity:0.2 },
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, { radius:6, color:'#5ee6a8', fillOpacity:0.8 })
    }).addTo(map);
    if(geojsonLayer.getBounds && geojsonLayer.getBounds().isValid()) map.fitBounds(geojsonLayer.getBounds(), { padding:[20,20] });
    document.getElementById('geojson-status').textContent = '? Rendered on map';
    document.getElementById('geojson-status').style.color = 'var(--green)';
  } catch(e) {
    document.getElementById('geojson-status').textContent = '? ' + e.message;
    document.getElementById('geojson-status').style.color = '#f87171';
  }
}

function loadCurrentAsGeoJSON() {
  const gj = { type:'FeatureCollection', features: features.map(f => {
    try { return f.layer.toGeoJSON(); } catch(e) { return null; }
  }).filter(Boolean) };
  document.getElementById('geojson-editor').value = JSON.stringify(gj, null, 2);
  toast('Current features loaded','ok');
}

async function loadGeoJSONFromURL() {
  const url = prompt('Enter GeoJSON URL:');
  if(!url) return;
  try {
    const res = await fetch(url);
    const data = await res.json();
    document.getElementById('geojson-editor').value = JSON.stringify(data, null, 2);
    renderGeoJSON();
  } catch(e) { toast('Failed to load: ' + e.message, 'err'); }
}

// ---------------------------------------------
// MEASURE
// ---------------------------------------------
function toggleMeasure() {
  measureActive = !measureActive;
  const btn = document.getElementById('measure-btn');
  btn.textContent = measureActive ? '? Stop Measuring' : '?? Start Measuring';
  btn.className = measureActive ? 'btn bp bsm' : 'btn bg bsm';
  if(!measureActive) updateMeasureDisplay();
  map.getContainer().style.cursor = measureActive ? 'crosshair' : '';
  toast(measureActive ? 'Click map to measure' : 'Measure stopped','info');
}

function addMeasurePoint(latlng) {
  measurePoints.push(latlng);
  if(measureLayer) map.removeLayer(measureLayer);
  if(measurePoints.length >= 2) {
    measureLayer = L.polyline(measurePoints, { color:'#fbbf24', weight:2, dashArray:'6,4' }).addTo(map);
  } else {
    measureLayer = L.circleMarker(latlng, { radius:5, color:'#fbbf24' }).addTo(map);
  }
  updateMeasureDisplay();
}

function updateMeasureDisplay() {
  if(!measurePoints.length) return;
  const imperial = document.getElementById('unit-imperial').checked;
  let totalDist = 0;
  for(let i=0;i<measurePoints.length-1;i++) totalDist += measurePoints[i].distanceTo(measurePoints[i+1]);
  const distStr = imperial ? (totalDist/1609.34).toFixed(2)+' mi' : totalDist < 1000 ? totalDist.toFixed(0)+' m' : (totalDist/1000).toFixed(2)+' km';
  document.getElementById('measure-result').style.display = 'block';
  document.getElementById('meas-distance').textContent = distStr;
  document.getElementById('meas-points').textContent = measurePoints.length + ' point(s)';
  // Area for polygon
  if(measurePoints.length >= 3) {
    const area = calcPolygonArea(measurePoints);
    const areaStr = imperial ? (area/4046.86).toFixed(2)+' acres' : area < 1e6 ? area.toFixed(0)+' m�' : (area/1e6).toFixed(2)+' km�';
    document.getElementById('meas-area').textContent = '? Area: ' + areaStr;
  }
}

function calcPolygonArea(pts) {
  // Shoelace formula on lat/lng (approximate)
  let area = 0;
  for(let i=0;i<pts.length;i++) {
    const j = (i+1)%pts.length;
    area += pts[i].lng * pts[j].lat;
    area -= pts[j].lng * pts[i].lat;
  }
  const degArea = Math.abs(area/2);
  return degArea * 111320 * 111320; // rough conversion
}

function clearMeasure() {
  measurePoints = [];
  if(measureLayer) { map.removeLayer(measureLayer); measureLayer=null; }
  document.getElementById('measure-result').style.display='none';
  if(measureActive) toggleMeasure();
}

// ---------------------------------------------
// EXPORT
// ---------------------------------------------
function exportGeoJSON() {
  const gj = { type:'FeatureCollection', features: features.map(f => {
    try { return f.layer.toGeoJSON(); } catch(e) { return null; }
  }).filter(Boolean) };
  download(JSON.stringify(gj, null, 2), 'map.geojson', 'application/json');
  toast('GeoJSON exported','ok');
}

function exportCSV() {
  const markers = features.filter(f => f.type === 'marker');
  if(!markers.length) { toast('No markers to export','err'); return; }
  const rows = ['name,lat,lng'];
  markers.forEach(f => {
    const ll = f.layer.getLatLng();
    rows.push(`${f.name},${ll.lat.toFixed(6)},${ll.lng.toFixed(6)}`);
  });
  download(rows.join('\n'), 'markers.csv', 'text/csv');
  toast('CSV exported','ok');
}

function exportKML() {
  const placemarks = features.map(f => {
    try {
      const gj = f.layer.toGeoJSON();
      const coords = gj.geometry?.coordinates;
      if(!coords) return '';
      if(gj.geometry.type === 'Point') {
        return `<Placemark><name>${f.name}</name><Point><coordinates>${coords[0]},${coords[1]},0</coordinates></Point></Placemark>`;
      }
      return '';
    } catch(e) { return ''; }
  }).join('\n');
  const kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Map Studio Export</name>${placemarks}</Document></kml>`;
  download(kml, 'map.kml', 'application/vnd.google-earth.kml+xml');
  toast('KML exported','ok');
}

function importGeoJSONFile(file) {
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const gj = JSON.parse(e.target.result);
      const layer = L.geoJSON(gj, { style:{color:'#5ee6a8',weight:2,fillOpacity:0.15} }).addTo(map);
      addFeature(layer, 'geojson', file.name.replace('.geojson',''));
      map.fitBounds(layer.getBounds(), { padding:[20,20] });
      toast('GeoJSON imported','ok');
    } catch(err) { toast('Invalid GeoJSON','err'); }
  };
  reader.readAsText(file);
}

function clearAll() {
  features.forEach(f => map.removeLayer(f.layer));
  features.length = 0;
  renderLayerList();
  if(routeLayer) { map.removeLayer(routeLayer); routeLayer=null; }
  if(heatLayer) { map.removeLayer(heatLayer); heatLayer=null; }
  if(geojsonLayer) { map.removeLayer(geojsonLayer); geojsonLayer=null; }
  heatData = [];
  toast('Map cleared','info');
}

// ---------------------------------------------
// STATUS BAR
// ---------------------------------------------
map.on('mousemove', e => {
  const lat = e.latlng.lat.toFixed(4), lng = e.latlng.lng.toFixed(4);
  document.getElementById('coord-display').textContent = lat + ', ' + lng;
  document.getElementById('sb-coords').textContent = Math.abs(lat)+'�'+(lat>=0?'N':'S')+', '+Math.abs(lng)+'�'+(lng>=0?'E':'W');
});
map.on('zoomend', () => {
  document.getElementById('sb-zoom').textContent = 'Zoom: ' + map.getZoom();
});

// ---------------------------------------------
// HELPERS
// ---------------------------------------------
function download(content, name, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = 'toast' + (type?' '+type:'');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}
</script>

<script>
window.__TOUR_STEPS__ = [{sel:".topbar-logo",title:"Welcome to Map Studio",body:"A Leaflet.js interactive map tool � draw markers, plan routes, render heatmaps, measure distances, export GeoJSON.",tip:"bottom"},{sel:".etabs",title:"7 map modes",body:"Markers, Draw shapes, Route planner, Heatmap, GeoJSON editor, Measure tool, and Settings � each in its own panel.",tip:"bottom"},{sel:".sidebar",title:"Map tools panel",body:"Add markers, geocode addresses, upload heatmap CSV data, or edit raw GeoJSON from the left sidebar.",tip:"right"},{sel:"#map",title:"Interactive map",body:"Click to add markers, drag to pan, scroll to zoom. Switch between 6 tile layers � street, satellite, terrain, dark � in Settings.",tip:"right"},{sel:".seo-footer",title:"Export your data",body:"Export all markers and drawn shapes as GeoJSON or CSV for use in any mapping library or GIS application.",tip:"top"}];

<script>
(function(){
  'use strict';
  var TOUR_KEY='ui_tour_'+(location.hostname.split('.')[0]||'tool');
  var steps=window.__TOUR_STEPS__||[];
  var current=0,active=false;
  var overlay,tipEl;

  function init(){
    if(!steps.length)return;
    overlay=document.createElement('div');
    overlay.id='tour-overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label','Guided tour');

    var svgNS='http://www.w3.org/2000/svg';
    var svgEl=document.createElementNS(svgNS,'svg');
    svgEl.id='tour-svg';
    svgEl.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9001;pointer-events:none';
    var defs=document.createElementNS(svgNS,'defs');
    var clip=document.createElementNS(svgNS,'clipPath');
    clip.id='tour-clip';
    var outerR=document.createElementNS(svgNS,'rect');
    outerR.setAttribute('width','200%');outerR.setAttribute('height','200%');
    var holeR=document.createElementNS(svgNS,'rect');
    holeR.id='tour-hole';
    clip.appendChild(outerR);clip.appendChild(holeR);defs.appendChild(clip);
    var dimR=document.createElementNS(svgNS,'rect');
    dimR.setAttribute('width','200%');dimR.setAttribute('height','200%');
    dimR.setAttribute('clip-path','url(#tour-clip)');
    dimR.setAttribute('fill','rgba(3,5,10,0.78)');
    var glowR=document.createElementNS(svgNS,'rect');
    glowR.id='tour-glow';
    glowR.setAttribute('fill','none');
    glowR.setAttribute('stroke','rgba(59,130,246,0.55)');
    glowR.setAttribute('stroke-width','2');
    svgEl.appendChild(defs);svgEl.appendChild(dimR);svgEl.appendChild(glowR);
    overlay.appendChild(svgEl);

    tipEl=document.createElement('div');
    tipEl.id='tour-tip';
    tipEl.innerHTML=
      '<div class="tour-progress"><div class="tour-progress-fill" id="tour-pfill"></div></div>'+
      '<div class="tour-step-label" id="tour-slbl"></div>'+
      '<div class="tour-tip-title" id="tour-ttl"></div>'+
      '<div class="tour-tip-body" id="tour-tbdy"></div>'+
      '<div class="tour-footer">'+
        '<div class="tour-dots" id="tour-dots"></div>'+
        '<div class="tour-nav">'+
          '<button class="tour-nav-btn tour-prev" id="tour-prev" onclick="__tourPrev()" aria-label="Previous">&#8592; Prev</button>'+
          '<button class="tour-nav-btn tour-next" id="tour-next" onclick="__tourNext()" aria-label="Next">Next &#8594;</button>'+
        '</div>'+
      '</div>'+
      '<button class="tour-skip" onclick="endTour()">Skip tour &times;</button>';
    overlay.appendChild(tipEl);
    document.body.appendChild(overlay);

    overlay.addEventListener('click',function(e){if(e.target===overlay)endTour();});
    document.addEventListener('keydown',function(e){
      if(!active)return;
      if(e.key==='Escape')endTour();
      if(e.key==='ArrowRight'||e.key==='Enter')__tourNext();
      if(e.key==='ArrowLeft')__tourPrev();
    });

    renderDots();
    var seen=localStorage.getItem(TOUR_KEY);
    if(!seen)setTimeout(function(){startTour();},1500);
  }

  function renderDots(){
    var d=document.getElementById('tour-dots');
    if(!d)return;
    d.innerHTML=steps.map(function(_,i){
      return'<div class="tour-dot'+(i===current?' active':'')+'" onclick="__tourGo('+i+')" tabindex="0" role="button" aria-label="Step '+(i+1)+'"></div>';
    }).join('');
  }

  function spotlight(el){
    if(!el)return;
    var r=el.getBoundingClientRect(),p=10,rx=10;
    var x=r.left-p,y=r.top-p,w=r.width+p*2,h=r.height+p*2;
    var hole=document.getElementById('tour-hole');
    var glow=document.getElementById('tour-glow');
    if(hole){hole.setAttribute('x',x);hole.setAttribute('y',y);hole.setAttribute('width',w);hole.setAttribute('height',h);hole.setAttribute('rx',rx);}
    if(glow){glow.setAttribute('x',x);glow.setAttribute('y',y);glow.setAttribute('width',w);glow.setAttribute('height',h);glow.setAttribute('rx',rx);}
    el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
  }

  function positionTip(el,side){
    if(!tipEl||!el)return;
    tipEl.className='';
    var r=el.getBoundingClientRect();
    var tw=tipEl.offsetWidth||320,th=tipEl.offsetHeight||220;
    var vw=window.innerWidth,vh=window.innerHeight,m=16;
    var top,left,arrow;
    if(side==='bottom'&&r.bottom+th+m<vh){top=r.bottom+m;left=r.left;arrow='top';}
    else if(side==='top'&&r.top-th-m>0){top=r.top-th-m;left=r.left;arrow='bottom';}
    else if(side==='right'&&r.right+tw+m<vw){top=r.top;left=r.right+m;arrow='left';}
    else if(side==='left'&&r.left-tw-m>0){top=r.top;left=r.left-tw-m;arrow='right';}
    else{top=Math.min(r.bottom+m,vh-th-m);left=r.left;arrow='top';}
    left=Math.max(m,Math.min(left,vw-tw-m));
    top=Math.max(m+56,Math.min(top,vh-th-m));
    tipEl.style.top=top+'px';tipEl.style.left=left+'px';
    tipEl.classList.add('arrow-'+arrow);
  }

  function renderStep(idx){
    if(idx<0||idx>=steps.length)return;
    current=idx;
    var step=steps[idx],total=steps.length;
    var el=step.sel?document.querySelector(step.sel):null;
    document.getElementById('tour-slbl').textContent='Step '+(idx+1)+' of '+total;
    document.getElementById('tour-ttl').textContent=step.title||'';
    document.getElementById('tour-tbdy').textContent=step.body||'';
    var pf=document.getElementById('tour-pfill');
    if(pf)pf.style.width=Math.round(((idx+1)/total)*100)+'%';
    var prev=document.getElementById('tour-prev');
    var next=document.getElementById('tour-next');
    if(prev)prev.style.display=idx===0?'none':'';
    if(next)next.textContent=idx===total-1?'Finish \u2713':'Next \u2192';
    document.querySelectorAll('.tour-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
    if(el){
      spotlight(el);
      setTimeout(function(){positionTip(el,step.tip||'bottom');},80);
    }else{
      var hole=document.getElementById('tour-hole');
      if(hole){hole.setAttribute('width','0');hole.setAttribute('height','0');}
      tipEl.style.top='50%';tipEl.style.left='50%';
      tipEl.style.transform='translate(-50%,-50%)';
    }
  }

  window.__tourGo=function(i){if(active)renderStep(i);};
  window.__tourNext=function(){if(!active)return;if(current>=steps.length-1){endTour();return;}renderStep(current+1);};
  window.__tourPrev=function(){if(active&&current>0)renderStep(current-1);};

  window.startTour=function(){
    if(!steps.length)return;
    active=true;current=0;
    overlay.classList.add('active');
    document.body.style.overflow='hidden';
    renderStep(0);
  };

  window.endTour=function(){
    active=false;
    if(overlay)overlay.classList.remove('active');
    document.body.style.overflow='';
    localStorage.setItem(TOUR_KEY,'1');
  };

  window.resetTour=function(){localStorage.removeItem(TOUR_KEY);};

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init);
  }else{
    setTimeout(init,0);
  }
})();

</script>
