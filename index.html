<body>

<header class="topbar">

    <input type="text" id="searchInput" placeholder="Search location…" onkeydown="if(event.key==='Enter')searchLocation()">
    <button class="btn btn-ghost" onclick="searchLocation()" id="searchBtn">Go</button>
  </div>
  <button class="btn btn-add" id="addBtn" onclick="toggleAdd()">+ Add Marker</button>
  <button class="btn btn-green" onclick="exportJSON()" id="exportBtn" style="display:none">↓ Export JSON</button>
</header>

<main class="main">
  <div id="map"></div>
  <aside class="sidebar">
    <div class="sidebar-header">Markers <span class="count-badge" id="markerCount">0</span></div>
    <div class="marker-list" id="markerList"><p class="empty-msg">No markers yet.<br>Click "+ Add Marker" then click the map.</p></div>
    <div class="attr">Map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · <a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a></div>
  </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Fix Leaflet default icons
delete L.Icon.Default.prototype._getIconUrl
L.Icon.Default.mergeOptions({
  iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
  iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
  shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
})

const map = L.map('map').setView([20, 0], 2)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map)

let markers = [], nextId = 1, addMode = false

function toggleAdd() {
  addMode = !addMode
  const btn = document.getElementById('addBtn')
  btn.textContent = addMode ? '📍 Click map to place…' : '+ Add Marker'
  btn.classList.toggle('active', addMode)
  map.getContainer().style.cursor = addMode ? 'crosshair' : ''
}

map.on('click', e => {
  if (!addMode) return
  const id = nextId++
  const label = `Marker ${id}`
  const m = L.marker([e.latlng.lat, e.latlng.lng]).addTo(map)
    .bindPopup(`<b>${label}</b><br>${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`).openPopup()
  markers.push({ id, lat: e.latlng.lat, lng: e.latlng.lng, label, leaflet: m })
  renderList()
  toggleAdd()
})

function removeMarker(id) {
  const idx = markers.findIndex(m => m.id === id)
  if (idx === -1) return
  markers[idx].leaflet.remove()
  markers.splice(idx, 1)
  renderList()
}

function renderList() {
  const list = document.getElementById('markerList')
  document.getElementById('markerCount').textContent = markers.length
  document.getElementById('exportBtn').style.display = markers.length ? '' : 'none'
  if (!markers.length) { list.innerHTML = '<p class="empty-msg">No markers yet.<br>Click "+ Add Marker" then click the map.</p>'; return }
  list.innerHTML = markers.map(m => `
    <div class="marker-item">
      <div><p>${m.label}</p><small>${m.lat.toFixed(4)}, ${m.lng.toFixed(4)}</small></div>
      <button class="del-btn" onclick="removeMarker(${m.id})">✕</button>
    </div>`).join('')
}

async function searchLocation() {
  const q = document.getElementById('searchInput').value.trim()
  if (!q) return
  const btn = document.getElementById('searchBtn')
  btn.textContent = '…'
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`)
    const d = await r.json()
    if (d.length) map.setView([parseFloat(d[0].lat), parseFloat(d[0].lon)], 13)
  } catch(e) {}
  btn.textContent = 'Go'
}

function exportJSON() {
  const data = markers.map(({ id, lat, lng, label }) => ({ id, lat, lng, label }))
  const a = document.createElement('a')
  a.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(data, null, 2))
  a.download = 'markers.json'
  a.click()
}
</script>
